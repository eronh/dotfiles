- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- link:
    # shell
    ~/.bashrc:
      path: home/.bashrc
      force: true
    # zsh always reads ~/.zshenv first; it sets ZDOTDIR, so .zshrc and the
    # rest of the config load from ~/.config/zsh.
    ~/.zshenv:
      force: true
      path: home/.config/zsh/.zshenv
    ~/.config/zsh:
      force: true
      path: home/.config/zsh
    ~/.p10k.zsh: home/.p10k.zsh
    ~/.config/fish: home/.config/fish

    # terminal emulators
    ~/.config/alacritty: home/.config/alacritty
    ~/.config/ghostty/config.ghostty: home/.config/config.ghostty
    ~/.config/wezterm: home/.config/wezterm

    # vim
    ~/.vimrc: home/.vimrc
    ~/.ideavimrc: home/.ideavimrc
    # deleted ~/.config/nvim? re-run ./install to relink it
    ~/.config/nvim: home/.config/nvim

    # scripts
    ~/.local/bin/yt-wpp: home/.local/bin/yt-wpp.sh

    ~/.config/mise: home/.config/mise
    ~/.gitconfig: home/.gitconfig
    ~/.config/git/hooks: home/.config/git/hooks
    ~/.inputrc:
      path: home/.inputrc
      force: true
    ~/.tmux.conf: home/.tmux.conf
    ~/.Brewfile: home/Brewfile
    ~/.finicky.ts: home/finicky.ts

- create:
    - ~/Workbench
    - ~/.vim/undodir

- shell:
    - description: "Install mise and its tools"
      command: |
        export PATH="$HOME/.local/bin:$PATH"
        command -v mise >/dev/null 2>&1 || curl -fsSL https://mise.run | sh
        mise install

    - description: "Compile copyfile.swift"
      command: |
        if [ "$(uname)" = "Darwin" ]; then
          swiftc ./bin/copyfile.swift -o ~/.local/bin/copyfile
        fi

    - description: install vim plug
      command: |
        [ -f ~/.vim/autoload/plug.vim ] || curl -fLo ~/.vim/autoload/plug.vim --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim

    - description: "Install fonts"
      command: "bash ./scripts/install-fonts.sh"

    - description: "Install alacritty themes"
      command: |
        THEMES_DIR=$HOME/.config/alacritty/themes
        REPO_URL=https://github.com/alacritty/alacritty-theme
        if [ ! -d "$THEMES_DIR" ] ; then
          git clone "$REPO_URL" "$THEMES_DIR"
        else
          git -C "$THEMES_DIR" pull
        fi

    - description: "Configure PM2 logrotate"
      command: "bash ./scripts/pm2-logrotate.sh"
