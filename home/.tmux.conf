# No default-shell/default-command here on purpose: tmux falls back to $SHELL,
# so panes follow whatever `chsh` set. Switching shells needs no tmux change.
# set-option -g default-shell /bin/zsh
# set-option -g default-shell /opt/homebrew/bin/fish

unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g default-terminal "screen-256color"

set -g prefix C-space
unbind C-b
bind-key C-space send-prefix

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Press prefix + c to create a new window to the right in the same directory
bind c new-window -a -c "#{pane_current_path}"

# Press prefix + Shift + c to create a new window at the end in the same directory
bind C new-window -c "#{pane_current_path}"

# moving between panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resizing panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# trying a better search keybinding
bind-key / copy-mode \; send-key ?

# window settings
set-option -g status-position bottom
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# set-window-option -g automatic-rename off

set -g extended-keys on
set -g extended-keys-format csi-u
set-option -g allow-rename off
set -g focus-events on

# list of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tpm'
# continuum last: it needs resurrect loaded and appends its save hook to status-right
set -g @plugin 'tmux-plugins/tmux-continuum'

# Nord color palette.
set -g @nord0 "#2E3440"
set -g @nord1 "#3B4252"
set -g @nord2 "#434C5E"
set -g @nord3 "#4C566A"
set -g @nord4 "#D8DEE9"
set -g @nord5 "#E5E9F0"
set -g @nord6 "#ECEFF4"
set -g @nord7 "#8FBCBB"
set -g @nord8 "#88C0D0"
set -g @nord9 "#81A1C1"
set -g @nord10 "#5E81AC"
set -g @nord11 "#BF616A"
set -g @nord12 "#D08770"
set -g @nord13 "#EBCB8B"
set -g @nord14 "#A3BE8C"
set -g @nord15 "#B48EAD"

# automatic restore session
# set -g @continuum-restore 'on'

# switch tabs on option-shift-arrow (macos)
bind-key -n M-S-Right next-window
bind-key -n M-S-Left previous-window
bind-key -n M-H next-window
bind-key -n M-L previous-window

bind-key -n C-k clear-history

# Resurrect: prefix + S to save, prefix + R to restore (defaults are C-s / C-r)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep status enabled; continuum depends on the status line for periodic saving.
set -g status on

# Status bar appearance.
set -g status-justify left
set -g status-style 'fg=#{@nord4},bg=#{@nord0}'
set -g status-left-length 40
set -g status-right-length 90
set -g status-left '#[fg=#{@nord0},bg=#{@nord13},nobold] #{?client_prefix,PREFIX,#S} #[fg=#{@nord8},bg=#{@nord0},nobold] '
set -g status-right '#[fg=#{@nord3},bg=#{@nord0}]#{b:pane_current_path}  #[fg=#{@nord8},bold]%H:%M #[fg=#{@nord4}]%Y-%m-%d '

# Window tabs: roomy inactive tabs with a strong active highlight.
setw -g window-status-separator ' '
setw -g window-status-style 'fg=#{@nord3},bg=#{@nord0}'
setw -g window-status-format '#[fg=#{@nord8},bg=#{@nord1}] #I: #W#F  '
setw -g window-status-current-style 'fg=#{@nord0},bg=#{@nord8},nobold'
setw -g window-status-current-format '#[fg=#{@nord0},bg=#{@nord8},nobold] #I: #W#F  '
setw -g window-status-activity-style 'fg=#{@nord13},bg=#{@nord0},bold'

# Rename windows from active pane cwd.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?pane_current_path,#{b:pane_current_path},#{pane_current_command}}'

# Rename to '~' if in the home directory, otherwise use the current folder's base name
# set-option -g automatic-rename-format "#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}"

# Make cwd/name updates feel responsive.
set -g status-interval 1

# After resurrect restores named windows, re-enable auto rename on every restored window.
# Off: that script was never created/linked, so the hook silently did nothing.
# set -g @resurrect-hook-post-restore-all "$HOME/.config/tmux/reenable-window-autonames.sh"
set -g @resurrect-hook-post-restore-all 'tmux list-windows -a -F "#{window_id}" | xargs -I{} tmux set -w -u -t {} automatic-rename'

# Popups
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

bind C-n display-popup -E 'bash -i -c "read -p \"Session name:\" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
# No command: display-popup runs the default shell ($SHELL).
# bind C-t display-popup -d "#{pane_current_path}" -E "zsh"
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -E

# run-shell ~/clone/path/resurrect.tmux # only if manually installed
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
